<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation of Promises</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
    background: #02030a;
    color: white;
}

#sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(
        circle at 50% 45%,
        #10152c 0%,
        #050817 45%,
        #010208 100%
    );
}

#constellation-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.star {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 8px 2px rgba(255,255,255,.9),
        0 0 20px 5px rgba(150,180,255,.45);
    z-index: 2;
    animation: twinkle 3s infinite ease-in-out;
}

.star.promise-star { cursor: pointer; }

.star.flying {
    animation: shootingArrival 1.8s ease-out forwards;
}

.star.flying::before {
    content: "";
    position: absolute;
    width: 65px;
    height: 2px;
    right: 3px;
    top: 50%;
    transform: translateY(-50%) rotate(-35deg);
    background: linear-gradient(
        90deg,
        transparent,
        rgba(140,180,255,.3),
        white
    );
    box-shadow: 0 0 12px rgba(150,190,255,.8);
    animation: trailFade 1.8s ease-out forwards;
    pointer-events: none;
}

.star.flying::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: rgba(190,215,255,.35);
    filter: blur(7px);
    animation: sparklePulse 1.2s ease-out forwards;
    pointer-events: none;
}

@keyframes shootingArrival {
    0% {
        opacity: 0;
        transform: translate(-45px,75px) scale(.2);
        filter: brightness(3);
    }
    20% {
        opacity: 1;
        transform: translate(-30px,50px) scale(1.5);
        filter: brightness(3);
    }
    65% {
        opacity: 1;
        transform: translate(-5px,8px) scale(1.1);
    }
    100% {
        opacity: 1;
        transform: translate(0,0) scale(1);
        filter: brightness(1);
    }
}

@keyframes trailFade {
    0%, 15% { opacity: 0; }
    30% { opacity: 1; }
    75% { opacity: .8; }
    100% { opacity: 0; }
}

@keyframes sparklePulse {
    0% { opacity: 0; transform: scale(.2); }
    35% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(2.5); }
}

@keyframes twinkle {
    0%, 100% { opacity: .65; }
    50% { opacity: 1; }
}

.sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px 2px rgba(175,205,255,.9);
    pointer-events: none;
    z-index: 4;
    animation: sparkleDrift 1.2s ease-out forwards;
}

@keyframes sparkleDrift {
    0% {
        opacity: 0;
        transform: translate(0,0) scale(0);
    }
    25% {
        opacity: 1;
        transform: translate(var(--dx),var(--dy)) scale(1.3);
    }
    100% {
        opacity: 0;
        transform: translate(
            calc(var(--dx) * 2),
            calc(var(--dy) * 2)
        ) scale(0);
    }
}

#message-area {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: min(90%,500px);
    text-align: center;
    z-index: 10;
}

h1 {
    font-weight: normal;
    font-size: clamp(24px,5vw,42px);
    letter-spacing: 2px;
    margin-bottom: 25px;
    text-shadow: 0 0 20px rgba(255,255,255,.25);
}

textarea {
    width: 100%;
    height: 120px;
    resize: none;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(10px);
    color: white;
    font-family: Georgia, serif;
    font-size: 17px;
    outline: none;
}

textarea::placeholder { color: rgba(255,255,255,.45); }
textarea:focus { border-color: rgba(255,255,255,.5); }

button {
    margin-top: 15px;
    padding: 11px 30px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: white;
    font-family: Georgia, serif;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: rgba(255,255,255,.18);
    box-shadow: 0 0 20px rgba(255,255,255,.15);
}

button:disabled { opacity: .5; cursor: wait; }

#status {
    font-size: 13px;
    color: rgba(220,230,255,.8);
    min-height: 18px;
    line-height: 1.5;
}

#promise {
    display: none;
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: min(80%,450px);
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    background: rgba(5,7,20,.92);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(0,0,0,.6);
}

#promise-text {
    font-size: 20px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

#close { margin-top: 20px; }

@media (prefers-reduced-motion: reduce) {
    .star, .star.flying, .star.flying::before,
    .star.flying::after, .sparkle {
        animation-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div id="sky">
    <canvas id="constellation-canvas"></canvas>
</div>

<div id="message-area">
    <h1>Write your Unfinished Promise</h1>
    <textarea
        id="message"
        maxlength="500"
        placeholder="write your promise..."
        aria-label="Write your unfinished promise"
    ></textarea>
    <br>
    <button id="send">send</button>
    <p id="status" role="status" aria-live="polite"></p>
</div>

<div id="promise" role="dialog" aria-modal="true">
    <div id="promise-text"></div>
    <button id="close">close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// =====================================
// 1. SUPABASE CONNECTION
// =====================================

const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// =====================================
// 2. PAGE ELEMENTS
// =====================================
const SUPABASE_URL = "https://smvpztjgdvqblstnkhrz.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_6wPUxrMIQEl30r6QBbxV2Q_GWEITxfs";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const sky = document.getElementById("sky");
const message = document.getElementById("message");
const send = document.getElementById("send");
const status = document.getElementById("status");
const promise = document.getElementById("promise");
const promiseText = document.getElementById("promise-text");
const close = document.getElementById("close");
const canvas = document.getElementById("constellation-canvas");
const ctx = canvas.getContext("2d");

let savedPromises = [];

// =====================================
// 3. DECORATIVE BACKGROUND STARS
// =====================================

for (let i = 0; i < 35; i++) {
    createStar(Math.random() * 100, Math.random() * 100, null);
}

// =====================================
// 4. CREATE A STAR
// =====================================

function createStar(x, y, text, flying = false) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = x + "%";
    star.style.top = y + "%";

    if (text !== null && text !== undefined) {
        star.classList.add("promise-star");
        star.title = "Read an unfinished promise";

        star.addEventListener("click", () => {
            promiseText.textContent = text;
            promise.style.display = "block";
            close.focus();
        });
    }

    if (flying) {
        star.classList.add("flying");
        star.addEventListener("animationend", event => {
            if (event.animationName === "shootingArrival") {
                star.classList.remove("flying");
            }
        });
    }

    sky.appendChild(star);
    return star;
}

// =====================================
// 5. SPARKLE PARTICLES
// =====================================

function createSparkles(x, y) {
    for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = x + "%";
        sparkle.style.top = y + "%";
        sparkle.style.setProperty(
            "--dx",
            (Math.random() * 100 - 50) + "px"
        );
        sparkle.style.setProperty(
            "--dy",
            (Math.random() * 100 - 50) + "px"
        );

        sky.appendChild(sparkle);
        sparkle.addEventListener("animationend", () => sparkle.remove());
    }
}

// =====================================
// 6. CONSTELLATION CANVAS
// =====================================

function resizeCanvas() {
    const width = sky.clientWidth;
    const height = sky.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawConstellations();
}

function drawConstellations() {
    const width = sky.clientWidth;
    const height = sky.clientHeight;

    ctx.clearRect(0, 0, width, height);

    const stars = [...savedPromises].sort(
        (a, b) => Number(a.id) - Number(b.id)
    );

    if (stars.length < 5) return;

    const patterns = [
        [0, 2, 1, 4, 3, 0],
        [0, 1, 3, 2, 4, 0],
        [0, 3, 1, 2, 4, 0],
        [0, 2, 4, 1, 3, 0]
    ];

    for (let start = 0; start + 5 <= stars.length; start += 5) {
        const group = stars.slice(start, start + 5);
        const pattern = patterns[
            Math.abs(Number(group[0].id)) % patterns.length
        ];

        ctx.beginPath();

        pattern.forEach((index, i) => {
            const item = group[index];
            const px = item.x / 100 * width;
            const py = item.y / 100 * height;

            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        });

        ctx.strokeStyle = "rgba(165,195,255,.38)";
        ctx.lineWidth = 1;
        ctx.shadowColor = "rgba(130,170,255,.4)";
        ctx.shadowBlur = 5;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

window.addEventListener("resize", resizeCanvas);

// =====================================
// 7. LOAD PROMISES FROM THE DATABASE
// =====================================

async function loadPromises() {
    status.textContent = "Gathering promises from the sky...";

    const { data, error } = await db
        .from("promises")
        .select("id, message, x, y, created_at")
        .order("id", { ascending: true });

    if (error) {
        console.error("Loading promises failed:", error);
        status.textContent =
            "The sky couldn't load its promises. Please check the connection.";
        return;
    }

    savedPromises = data || [];

    savedPromises.forEach(item => {
        createStar(item.x, item.y, item.message);
    });

    drawConstellations();

    status.textContent = savedPromises.length +
        (savedPromises.length === 1
            ? " promise held in the sky."
            : " promises held in the sky.");
}

// =====================================
// 8. SAVE A NEW PROMISE
// =====================================

send.addEventListener("click", async () => {
    const text = message.value.trim();

    if (!text) {
        status.textContent = "Write a promise before sending it.";
        return;
    }

    send.disabled = true;
    status.textContent = "Sending your promise into the sky...";

    const x = 10 + Math.random() * 80;
    const y = 10 + Math.random() * 80;

    try {
        const { data, error } = await db
            .from("promises")
            .insert({ message: text, x, y })
            .select("id, message, x, y, created_at")
            .single();

        if (error) throw error;

        savedPromises.push(data);

        createStar(data.x, data.y, data.message, true);
        createSparkles(data.x, data.y);

        message.value = "";
        drawConstellations();

        status.textContent =
            "Your promise has found its place in the sky.";
    } catch (error) {
        console.error("Saving promise failed:", error);
        status.textContent =
            "Your promise couldn't be saved. Please try again.";
    } finally {
        send.disabled = false;
    }
});

// =====================================
// 9. CLOSE PROMISE POPUP
// =====================================

close.addEventListener("click", () => {
    promise.style.display = "none";
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        promise.style.display = "none";
    }
});

// =====================================
// 10. START
// =====================================

resizeCanvas();
loadPromises();
</script>

</body>
</html>
