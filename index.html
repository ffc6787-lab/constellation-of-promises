<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constellation of Promises</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
    background: #02030a;
    color: white;
}

#sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(
        circle at 50% 45%,
        #10152c 0%,
        #050817 45%,
        #010208 100%
    );
}

#constellation-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.star {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 8px 2px rgba(255,255,255,.9),
        0 0 20px 5px rgba(150,180,255,.45);
    z-index: 2;
    animation: twinkle 3s infinite ease-in-out;
}

.star.promise-star { cursor: pointer; }

.star.flying {
    animation: shootingArrival 1.8s ease-out forwards;
}

.star.flying::before {
    content: "";
    position: absolute;
    width: 65px;
    height: 2px;
    right: 3px;
    top: 50%;
    transform: translateY(calc(-50% + 16px)) rotate(-35deg);
    background: linear-gradient(
        90deg,
        transparent,
        rgba(140,180,255,.3),
        white
    );
    box-shadow: 0 0 12px rgba(150,190,255,.8);
    animation: trailFade 1.8s ease-out forwards;
    pointer-events: none;
}

.star.flying::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: rgba(190,215,255,.35);
    filter: blur(7px);
    animation: sparklePulse 1.2s ease-out forwards;
    pointer-events: none;
}

@keyframes shootingArrival {
    0% {
        opacity: 0;
        transform: translate(-45px,75px) scale(.2);
        filter: brightness(3);
    }
    20% {
        opacity: 1;
        transform: translate(-30px,50px) scale(1.5);
        filter: brightness(3);
    }
    65% {
        opacity: 1;
        transform: translate(-5px,8px) scale(1.1);
    }
    100% {
        opacity: 1;
        transform: translate(0,0) scale(1);
        filter: brightness(1);
    }
}

@keyframes trailFade {
    0%, 15% { opacity: 0; }
    30% { opacity: 1; }
    75% { opacity: .8; }
    100% { opacity: 0; }
}

@keyframes sparklePulse {
    0% { opacity: 0; transform: scale(.2); }
    35% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0; transform: scale(2.5); }
}

@keyframes twinkle {
    0%, 100% { opacity: .65; }
    50% { opacity: 1; }
}

.sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px 2px rgba(175,205,255,.9);
    pointer-events: none;
    z-index: 4;
    animation: sparkleDrift 1.2s ease-out forwards;
}

@keyframes sparkleDrift {
    0% {
        opacity: 0;
        transform: translate(0,0) scale(0);
    }
    25% {
        opacity: 1;
        transform: translate(var(--dx),var(--dy)) scale(1.3);
    }
    100% {
        opacity: 0;
        transform: translate(
            calc(var(--dx) * 2),
            calc(var(--dy) * 2)
        ) scale(0);
    }
}

#message-area {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: min(90%,500px);
    text-align: center;
    z-index: 10;
}

h1 {
    font-weight: normal;
    font-size: clamp(24px,5vw,42px);
    letter-spacing: 2px;
    margin-bottom: 25px;
    text-shadow: 0 0 20px rgba(255,255,255,.25);
}

textarea {
    width: 100%;
    height: 120px;
    resize: none;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(10px);
    color: white;
    font-family: Georgia, serif;
    font-size: 17px;
    outline: none;
}

textarea::placeholder { color: rgba(255,255,255,.45); }
textarea:focus { border-color: rgba(255,255,255,.5); }

button {
    margin-top: 15px;
    padding: 11px 30px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: white;
    font-family: Georgia, serif;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: rgba(255,255,255,.18);
    box-shadow: 0 0 20px rgba(255,255,255,.15);
}

button:disabled { opacity: .5; cursor: wait; }

#status {
    font-size: 13px;
    color: rgba(220,230,255,.8);
    min-height: 18px;
    line-height: 1.5;
}

#promise {
    display: none;
    position: fixed;
    z-index: 20;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: min(80%,450px);
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    background: rgba(5,7,20,.92);
    border: 1px solid rgba(255,255,255,.2);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(0,0,0,.6);
}

#promise-text {
    font-size: 20px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

#close { margin-top: 20px; }

@media (prefers-reduced-motion: reduce) {
    .star, .star.flying, .star.flying::before,
    .star.flying::after, .sparkle {
        animation-duration: .01ms !important;
    }
}

/* The writing interface dissolves into the sky */
#message-area {
    transition: none;
    transform-origin: center center;
}

#message-area.dissolving {
    animation: interfaceDissolve 1.2s ease-in forwards;
    pointer-events: none;
}

@keyframes interfaceDissolve {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
    }
    45% {
        opacity: 0.7;
        transform: translate(-50%, -50%) scale(0.97);
        filter: blur(2px);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.88);
        filter: blur(12px);
        visibility: hidden;
    }
}

/* Particles that carry the interface into a star */
.dissolve-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 6px 2px rgba(190, 215, 255, 0.9),
        0 0 14px rgba(130, 170, 255, 0.7);
    pointer-events: none;
    z-index: 12;
    animation: dissolveToStar 1.2s ease-in forwards;
}

@keyframes dissolveToStar {
    0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.4);
    }
    20% {
        opacity: 1;
        transform: translate(
            calc(var(--dx) * 0.15),
            calc(var(--dy) * 0.15)
        ) scale(1.3);
    }
    75% {
        opacity: 0.9;
        transform: translate(
            calc(var(--dx) * 0.8),
            calc(var(--dy) * 0.8)
        ) scale(0.8);
    }
    100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
    }
}

/* Keep the page usable on smaller screens */
@media (max-width: 600px) {
    #message-area {
        width: 88%;
    }
}    

    #music-toggle {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 30;
    margin: 0;
    padding: 10px 16px;
    background: rgba(5,7,20,.8);
    color: white;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 30px;
    font-family: Georgia, serif;
    font-size: 13px;
    cursor: pointer;
}
    /* Promise confirmation window */
#confirm-dialog {
    position: fixed;
    z-index: 25;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(88%, 440px);
    max-height: 85vh;
    overflow-y: auto;
    padding: 28px;
    text-align: center;
    border-radius: 14px;
    background: rgba(5, 7, 20, .96);
    border: 1px solid rgba(255, 255, 255, .22);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 45px rgba(0, 0, 0, .6);
}

#confirm-heading {
    font-weight: normal;
    font-size: 24px;
    line-height: 1.4;
}

#confirm-text {
    font-size: 17px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    color: rgba(235, 240, 255, .9);
    margin: 20px 0;
}

.confirm-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.confirm-actions button {
    max-width: 100%;
    margin-top: 5px;
}

/* Return to writing from the open sky */
#return-to-writing {
    position: fixed;
    z-index: 30;
    left: 20px;
    bottom: 20px;
    margin: 0;
    padding: 12px 18px;
    max-width: calc(100% - 40px);
    background: rgba(5, 7, 20, .88);
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 30px;
    color: white;
    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: .4px;
    backdrop-filter: blur(10px);
}

#return-to-writing:hover {
    background: rgba(255, 255, 255, .18);
}

@media (max-width: 480px) {
    #return-to-writing {
        left: 10px;
        bottom: 10px;
        max-width: calc(100% - 20px);
        font-size: 12px;
    }

    #music-toggle {
        right: 10px;
        bottom: 10px;
    }
}    
</style>
</head>

<body>
    
<audio id="background-music" preload="auto"></audio>

<button id="music-toggle" type="button"
    aria-label="Turn background music on">
    ♫ Music off
</button>
    
<div id="sky">
    <canvas id="constellation-canvas"></canvas>
</div>

<div id="message-area">
    <h1>Write Your Unfinished Promise</h1>
    <textarea
        id="message"

    <h2 id="confirm-heading">Is this your promise?</h2>

        <button id="confirm-submit">Yes, send it into the sky</button>
        <button id="confirm-cancel">Edit it more</button>
    </div>
</div>

<!-- Return-to-writing button -->
<button id="return-to-writing"
        type="button"
        style="display: none;">
    Write another unfinished promise
</button>

    <div id="promise-text"></div>
    <button id="close">close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// =====================================
// 1. SUPABASE CONNECTION
// =====================================

const SUPABASE_URL = "https://smvpztjgdvqblstnkhrz.supabase.co";
const SUPABASE_KEY = "sb_publishable_6wPUxrMIQEl30r6QBbxV2Q_GWEITxfs";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// =====================================
// 2. PAGE ELEMENTS
// =====================================

const sky = document.getElementById("sky");
const message = document.getElementById("message");
const send = document.getElementById("send");
const status = document.getElementById("status");
const promise = document.getElementById("promise");
const promiseText = document.getElementById("promise-text");
const close = document.getElementById("close");
const canvas = document.getElementById("constellation-canvas");
const ctx = canvas.getContext("2d");

let savedPromises = [];

// =====================================
// 3. DECORATIVE BACKGROUND STARS
// =====================================

for (let i = 0; i < 35; i++) {
    createStar(Math.random() * 100, Math.random() * 100, null);
}

// =====================================
// 4. CREATE A STAR
// =====================================

function createStar(x, y, text, flying = false) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = x + "%";
    star.style.top = y + "%";

    if (text !== null && text !== undefined) {
        star.classList.add("promise-star");
        star.title = "Read an unfinished promise";

        star.addEventListener("click", () => {
            promiseText.textContent = text;
            promise.style.display = "block";
            close.focus();
        });
    }

    if (flying) {
        star.classList.add("flying");
        star.addEventListener("animationend", event => {
            if (event.animationName === "shootingArrival") {
                star.classList.remove("flying");
            }
        });
    }

    sky.appendChild(star);
    return star;
}

// =====================================
// 5. SPARKLE PARTICLES
// =====================================

function createSparkles(x, y) {
    for (let i = 0; i < 12; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = x + "%";
        sparkle.style.top = y + "%";
        sparkle.style.setProperty(
            "--dx",
            (Math.random() * 100 - 50) + "px"
        );
        sparkle.style.setProperty(
            "--dy",
            (Math.random() * 100 - 50) + "px"
        );

        sky.appendChild(sparkle);
        sparkle.addEventListener("animationend", () => sparkle.remove());
    }
}
function dissolveInterface(targetX, targetY) {
    const area = document.getElementById("message-area");
    const rect = area.getBoundingClientRect();
    const skyRect = sky.getBoundingClientRect();

    // Convert the star's percentage position into pixels.
    const targetLeft =
        skyRect.left + (targetX / 100) * skyRect.width;
    const targetTop =
        skyRect.top + (targetY / 100) * skyRect.height;

    // Scatter particles throughout the writing interface.
    for (let i = 0; i < 55; i++) {
        const particle = document.createElement("div");
        particle.className = "dissolve-particle";

        const startX = rect.left + Math.random() * rect.width;
        const startY = rect.top + Math.random() * rect.height;

        particle.style.left = (startX - skyRect.left) + "px";
        particle.style.top = (startY - skyRect.top) + "px";

        particle.style.setProperty(
            "--dx",
            (targetLeft - startX) + "px"
        );

        particle.style.setProperty(
            "--dy",
            (targetTop - startY) + "px"
        );

        sky.appendChild(particle);

        particle.addEventListener("animationend", () => {
            particle.remove();
        }, { once: true });
    }

    // Dissolve the title, text box, and button together.
    area.classList.add("dissolving");

    // Let the visitor explore the sky without the form.
   area.addEventListener("animationend", () => {
    area.style.display = "none";
    returnToWriting.style.display = "block";
}, { once: true });
}
    
// =====================================
// 6. CONSTELLATION CANVAS
// =====================================

function resizeCanvas() {
    const width = sky.clientWidth;
    const height = sky.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawConstellations();
}

function drawConstellations() {
    const width = sky.clientWidth;
    const height = sky.clientHeight;

    ctx.clearRect(0, 0, width, height);

    const stars = [...savedPromises].sort(
        (a, b) => Number(a.id) - Number(b.id)
    );

    const GROUP_SIZE = 7;

    if (stars.length < GROUP_SIZE) return;

    // Seven-star patterns designed to reduce line crossings.
    const patterns = [
        [0, 1, 2, 3, 4, 5, 6, 0],
        [0, 2, 4, 6, 5, 3, 1, 0],
        [0, 1, 3, 5, 6, 4, 2, 0],
        [0, 2, 1, 3, 5, 4, 6, 0]
    ];

    // Count proper intersections between two line segments.
    function segmentsCross(a, b, c, d) {
        function orientation(p, q, r) {
            return (q.x - p.x) * (r.y - p.y) -
                   (q.y - p.y) * (r.x - p.x);
        }

        const o1 = orientation(a, b, c);
        const o2 = orientation(a, b, d);
        const o3 = orientation(c, d, a);
        const o4 = orientation(c, d, b);

        return o1 * o2 < 0 && o3 * o4 < 0;
    }

    // Select the pattern with the fewest crossing lines.
    function choosePattern(group) {
        const points = group.map(item => ({
            x: item.x / 100 * width,
            y: item.y / 100 * height
        }));

        let bestPattern = patterns[0];
        let fewestCrossings = Infinity;

        for (const pattern of patterns) {
            const edges = [];

            for (let i = 0; i < pattern.length - 1; i++) {
                edges.push([
                    points[pattern[i]],
                    points[pattern[i + 1]]
                ]);
            }

            let crossings = 0;

            for (let i = 0; i < edges.length; i++) {
                for (let j = i + 1; j < edges.length; j++) {
                    // Adjacent lines share a star, so ignore them.
                    if (
                        edges[i][0] === edges[j][0] ||
                        edges[i][0] === edges[j][1] ||
                        edges[i][1] === edges[j][0] ||
                        edges[i][1] === edges[j][1]
                    ) continue;

                    if (segmentsCross(
                        edges[i][0],
                        edges[i][1],
                        edges[j][0],
                        edges[j][1]
                    )) {
                        crossings++;
                    }
                }
            }

            if (crossings < fewestCrossings) {
                fewestCrossings = crossings;
                bestPattern = pattern;
            }
        }

        return bestPattern;
    }

    // Draw each seven-star constellation separately.
    for (
        let start = 0;
        start + GROUP_SIZE <= stars.length;
        start += GROUP_SIZE
    ) {
        const group = stars.slice(start, start + GROUP_SIZE);
        const pattern = choosePattern(group);

        ctx.beginPath();

        pattern.forEach((index, i) => {
            const item = group[index];
            const px = item.x / 100 * width;
            const py = item.y / 100 * height;

            if (i === 0) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        });

        ctx.strokeStyle = "rgba(165,195,255,.32)";
        ctx.lineWidth = 1;
        ctx.shadowColor = "rgba(130,170,255,.3)";
        ctx.shadowBlur = 4;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

window.addEventListener("resize", resizeCanvas);

// =====================================
// 7. LOAD PROMISES FROM THE DATABASE
// =====================================

async function loadPromises() {
    status.textContent = "Gathering promises from the sky...";

    const { data, error } = await db
        .from("promises")
        .select("id, message, x, y, created_at")
        .order("id", { ascending: true });

    if (error) {
        console.error("Loading promises failed:", error);
        status.textContent = "Load error: " + error.message;
        return;
    }

    savedPromises = data || [];

    savedPromises.forEach(item => {
        createStar(item.x, item.y, item.message);
    });

    drawConstellations();

    status.textContent = savedPromises.length +
        (savedPromises.length === 1
            ? " promise held in the sky."
            : " promises held in the sky.");
}
/* =====================================
   8. CONFIRM AND SAVE A PROMISE
===================================== */

const confirmDialog = document.getElementById("confirm-dialog");
const confirmText = document.getElementById("confirm-text");
const confirmSubmit = document.getElementById("confirm-submit");
const confirmCancel = document.getElementById("confirm-cancel");
const returnToWriting = document.getElementById("return-to-writing");

let pendingPromise = "";

// Step 1: Ask the visitor to confirm their promise.
function sendPromise() {
    const text = message.value.trim();

    if (!text) {
        status.textContent = "Write a promise before sending it.";
        message.focus();
        return;
    }

    if (send.disabled) return;

    pendingPromise = text;
    confirmText.textContent = pendingPromise;
    confirmDialog.style.display = "block";
    confirmSubmit.focus();
}

// Step 2: Save only after confirmation.
async function savePromise() {
    if (!pendingPromise || send.disabled) return;

    const text = pendingPromise;

    send.disabled = true;
    confirmSubmit.disabled = true;
    confirmDialog.style.display = "none";
    status.textContent = "Sending your promise into the sky...";

    const x = 10 + Math.random() * 80;
    const y = 10 + Math.random() * 80;

    try {
        const { data, error } = await db
            .from("promises")
            .insert({ message: text, x, y })
            .select("id, message, x, y, created_at")
            .single();

        if (error) throw error;

        savedPromises.push(data);

        createStar(data.x, data.y, data.message, true);
        createSparkles(data.x, data.y);

        message.value = "";
        pendingPromise = "";

        drawConstellations();
        dissolveInterface(data.x, data.y);

        status.textContent =
            "Your promise has found its place in the sky.";

    } catch (error) {
        console.error("Saving promise failed:", error);

        status.textContent =
            "Your promise couldn't be saved. Please try again.";

        // Keep the text so the visitor can retry.
        message.value = text;

    } finally {
        send.disabled = false;
        confirmSubmit.disabled = false;
    }
}

// Confirm the promise.
confirmSubmit.addEventListener("click", savePromise);

// Return to editing without saving.
confirmCancel.addEventListener("click", () => {
    confirmDialog.style.display = "none";
    message.focus();
});

// Enter opens the confirmation window.
send.addEventListener("click", sendPromise);

message.addEventListener("keydown", event => {
    if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
    ) {
        event.preventDefault();
        sendPromise();
    }
});

// Escape closes the confirmation window without saving.
document.addEventListener("keydown", event => {
    if (
        event.key === "Escape" &&
        confirmDialog.style.display === "block"
    ) {
        confirmDialog.style.display = "none";
        message.focus();
    }
});

// Return to the writing interface from the sky.
returnToWriting.addEventListener("click", () => {
    const area = document.getElementById("message-area");

    area.classList.remove("dissolving");
    area.style.display = "block";
    area.style.visibility = "visible";
    area.style.opacity = "1";
    area.style.filter = "none";

    returnToWriting.style.display = "none";
    status.textContent = "";
    message.focus();
});

// =====================================
// 9. CLOSE PROMISE POPUP
// =====================================

close.addEventListener("click", () => {
    promise.style.display = "none";
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        promise.style.display = "none";
    }
});

// =====================================
// 10. START
// =====================================
const music = document.getElementById("background-music");
const musicToggle = document.getElementById("music-toggle");

const playlist = [
    "musicword-in-dream-229999.mp3",
    "drmseq-lost-in-purple-light-593136.mp3.mp3"
    "aksfx - Big Walk Theme (Jumping Voices).mp3"
];

let currentTrack = -1;
let musicEnabled = false;

music.volume = 0.25;

function chooseNextTrack() {
    if (playlist.length <= 1) return 0;

    let nextTrack;

    do {
        nextTrack = Math.floor(Math.random() * playlist.length);
    } while (nextTrack === currentTrack);

    return nextTrack;
}

async function playNextTrack() {
    if (!musicEnabled) return;

    currentTrack = chooseNextTrack();

    music.src = playlist[currentTrack];
    music.load();

    try {
        await music.play();

        musicToggle.textContent = "♫ Music on";
        musicToggle.setAttribute(
            "aria-label",
            "Turn background music off"
        );
    } catch (error) {
        console.error("Music playback failed:", error);
        musicToggle.textContent = "♫ Tap to play";
    }
}

music.addEventListener("ended", () => {
    if (musicEnabled) {
        playNextTrack();
    }
});

musicToggle.addEventListener("click", async () => {
    if (musicEnabled) {
        musicEnabled = false;
        music.pause();

        musicToggle.textContent = "♫ Music off";
        musicToggle.setAttribute(
            "aria-label",
            "Turn background music on"
        );
    } else {
        musicEnabled = true;
        await playNextTrack();
    }
});
resizeCanvas();
loadPromises();
</script>

</body>
</html>
